{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            {% block title %}
                django_template | Forbidden
            {% endblock title %}
        </title>
        <link rel="stylesheet" href="{% static "tailwind/styles.css" %}">
    </head>
    <body class="bg-gray-100 h-screen">
        <div class="flex flex-col items-center justify-center h-full">
            <div class="text-center mb-8">
                <h1 class="text-6xl font-bold text-gray-800 mb-6">Forbidden</h1>
                <p class="text-gray-500 max-w-md mx-auto">You don't have permission to access this resource.</p>
            </div>
            <div class="flex space-x-4">
                <button onclick="history.back()"
                        class="px-6 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-md transition duration-200 flex items-center">
                    Back
                </button>
                {# djlint:off D018 #}
                <a href="/"
                   class="px-6 py-2 bg-gray-600 hover:bg-gray-700 text-white rounded-md transition duration-200 flex items-center">
                    Home
                </a>
                {# djlint:on #}
            </div>
        </div>
    </body>
</html>
